name: strukku
description: "Foto struk, simpan tenang. — Scan, simpan, dan lacak struk belanja Anda."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera & Image
  camera: ^0.11.0
  image_picker: ^1.1.2
  image: ^4.2.0

  # OCR
  google_mlkit_text_recognition: ^0.13.0

  # Database
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Export
  pdf: ^3.11.1
  excel: ^4.0.3
  path_provider: ^2.1.4
  share_plus: ^9.0.0

  # Preferences
  shared_preferences: ^2.3.2

  # Charts
  fl_chart: ^0.68.0

  # Navigation
  go_router: ^14.2.7

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  shimmer: ^3.0.0
  permission_handler: ^11.3.1
  path: ^1.9.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  riverpod_generator: 2.4.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
