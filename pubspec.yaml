name: strukku
description: "Aplikasi penyimpan struk belanja digital dengan OCR"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera & Image
  camera: ^0.11.0
  image_picker: ^1.1.2
  image: ^4.2.0

  # OCR
  google_mlkit_text_recognition: ^0.13.0

  # Database
  drift: ^2.22.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Export
  pdf: ^3.11.1
  excel: ^4.0.3
  path_provider: ^2.1.4
  share_plus: 13.1.0

  # Preferences
  shared_preferences: ^2.3.2

  # Charts
  fl_chart: ^0.68.0

  # Navigation
  go_router: ^14.2.7

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.5.1

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  shimmer: ^3.0.0
  permission_handler: ^11.3.1
  path: ^1.9.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.22.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.6.5
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - Logo/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "Logo/logo_strukku.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "Logo/logo_strukku.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "Logo/logo_strukku.png"
  color_dark: "#FFFFFF"
  image_dark: "Logo/logo_strukku.png"
  android_12:
    color: "#FFFFFF"
    image: "Logo/logo_strukku.png"
    icon_background_color: "#FFFFFF"
  web: false
  ios: false
